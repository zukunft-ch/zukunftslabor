[tools]
erlang = "27.3.4.6"
elixir = "1.19.5-otp-27"
python = "3.13"

[tasks.fetch]
description = "Download all registered datasets"
run = ".venv/bin/python scripts/fetch_bfs.py"

[tasks.lab]
description = "Start LiveBook attached to project node"
run = """
#!/usr/bin/env bash
set -euo pipefail

COOKIE="zukunftslabor"
NODE_NAME="zukunftslabor"
NODE="$NODE_NAME@127.0.0.1"
PORT="${LIVEBOOK_PORT:-8080}"

# Check if node is already running
if epmd -names 2>/dev/null | grep -q "name $NODE_NAME"; then
  echo "==> Project node already running, attaching LiveBook..."
else
  echo "==> Starting project node ($NODE)..."
  elixir --name "$NODE" --cookie "$COOKIE" -S mix run --no-halt &
  NODE_PID=$!
  trap "kill $NODE_PID 2>/dev/null" EXIT

  # Wait for node to register with epmd (up to 15s)
  for i in $(seq 1 30); do
    if epmd -names 2>/dev/null | grep -q "name $NODE_NAME"; then
      echo "==> Node ready."
      break
    fi
    if ! kill -0 "$NODE_PID" 2>/dev/null; then
      echo "!! Node process exited unexpectedly." >&2
      exit 1
    fi
    sleep 0.5
  done

  if ! epmd -names 2>/dev/null | grep -q "name $NODE_NAME"; then
    echo "!! Node failed to register within 15s." >&2
    exit 1
  fi
fi

echo "==> Starting LiveBook on port $PORT..."
LIVEBOOK_HOME="$(pwd)/notebooks" \
LIVEBOOK_DEFAULT_RUNTIME="attached:$NODE:$COOKIE" \
  livebook server --port "$PORT"
"""

[tasks.export]
description = "Export notebook → draft + charts"
run = "mix zukunftslabor.export {{arg(name='path')}}"

[tasks.publish]
description = "Copy reviewed drafts + charts to die-zukunft.ch"
run = """
#!/usr/bin/env bash
set -euo pipefail

site="../die-zukunft.ch"
charts_dir="$site/static/zukunftslabor/charts"
content_dir="$site/content/zukunftslabor/notizen"

mkdir -p "$charts_dir" "$content_dir"

if ls output/charts/*.svg 1>/dev/null 2>&1; then
  cp output/charts/*.svg "$charts_dir/"
  echo "Copied SVG charts → $charts_dir"
fi

if ls output/charts/*.json 1>/dev/null 2>&1; then
  cp output/charts/*.json "$charts_dir/"
  echo "Copied JSON specs → $charts_dir"
fi

if ls output/drafts/*.md 1>/dev/null 2>&1; then
  cp output/drafts/*.md "$content_dir/"
  echo "Copied drafts → $content_dir"
fi

echo "Run 'zola build' in $site to verify."
"""

[tasks.test]
description = "Run Elixir tests"
run = "mix test"

[tasks.setup]
description = "Install all dependencies"
run = """
#!/usr/bin/env bash
set -euo pipefail
echo "==> Installing Elixir deps..."
mix deps.get
echo "==> Setting up Python venv..."
python -m venv .venv
.venv/bin/pip install -r scripts/requirements.txt
echo "==> Done."
"""
