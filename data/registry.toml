# Dataset registry — defines what to fetch and from where.
# Run `mise run fetch` to download all datasets.
# Run `mise run fetch <name>` to fetch a specific one.

# ─── Basic income modelling ──────────────────────────────────────────

[datasets.einkommensverteilung_silc]
description = "Einkommensverteilung nach Dezilen (SILC)"
source = "bfs"
path = "de/20/20.01"
table = "px-x-2004020000_104"
topic = "Einkommen, Verbrauch und Vermögen"
[datasets.einkommensverteilung_silc.dimensions]
# Year: latest available
"Jahr" = ["2022"]
# Income concept: equivalised disposable income
"Einkommenskonzept" = "*"
# Dezil: all deciles
"Dezil" = "*"

[datasets.soziale_sicherheit_transfers]
description = "Sozialleistungen nach Funktion (AHV, IV, EL, etc.)"
source = "bfs"
path = "de/13/13.02"
table = "px-x-1303010000_101"
topic = "Soziale Sicherheit"
[datasets.soziale_sicherheit_transfers.dimensions]
"Jahr" = ["2020", "2021", "2022"]
"Funktion" = "*"
"Leistungsart" = "*"

[datasets.steuerpflichtige_einkommen]
description = "Steuerpflichtiges Einkommen nach Kanton und Einkommensklasse"
source = "bfs"
path = "de/18/18.02"
table = "px-x-1802020000_102"
topic = "Öffentliche Finanzen"
[datasets.steuerpflichtige_einkommen.dimensions]
"Jahr" = ["2020"]
"Kanton" = "*"
"Einkommensklasse" = "*"

