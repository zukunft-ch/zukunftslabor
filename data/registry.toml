# Dataset registry — defines what to fetch and from where.
# Run `mise run fetch` to download all datasets.
# Run `mise run fetch <name>` to fetch a specific one.
#
# Source types:
#   bfs-pxweb  — BFS STAT-TAB PxWeb API (POST with dimension query)
#   bfs-dam    — BFS DAM API direct CSV/XLS download
#   url        — arbitrary URL download

# ─── Basic income modelling ──────────────────────────────────────────

[datasets.einkommensverteilung_silc]
description = "Einkommensverteilung nach Dezilen — Gini, Median, Mittelwert, Einkommensanteile (HABE/SILC)"
source = "bfs-dam"
url = "https://www.bfs.admin.ch/bfsstatic/dam/assets/15344786/master"
format = "xlsx"
note = "Excel with one sheet per year (2018–1998). Verfügbares Äquivalenzeinkommen in col F."
processed_as = "einkommensverteilung_silc.csv"

# ─── Digital sovereignty & e-ID ──────────────────────────────────────

[datasets.ikt_egov]
description = "E-Government-Nutzung: Behördenkontakte, Formulare, Informationssuche"
source = "bfs-pxweb"
table = "px-x-1604000000_103"
note = "Has 2014–2025 data. Percentage of population using e-government services."
processed_as = "ikt_egov.csv"
[datasets.ikt_egov.dimensions]
"Online-Dienste in Zusammenhang mit den Behörden" = ["IGV12", "IGOV12IFCH", "IGOV12FMCH", "IGOV12RTCH"]
"Geschlecht" = ["0"]
"Altersklasse" = ["0"]
"Bildungsstand" = ["0"]
"Jahr" = ["2025", "2023", "2021", "2019", "2017", "2014"]
"Absolut / relativ" = ["1"]
"Resultat" = ["0"]

# ─── Automation & labour ─────────────────────────────────────────────

[datasets.erwerbstaetige_sake]
description = "Erwerbstätige (Inlandkonzept) nach Wirtschaftsabschnitt — SAKE Jahres- und Quartalswerte"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/36278176/master"
format = "csv"
note = "Raw CSV with NOGA sector codes (A, B-C, ..., T). Annual data up to 2024, quarterly up to 2025-Q3."
processed_as = "erwerbstaetige_sake.csv"

# ─── Housing & inequality ────────────────────────────────────────────

[datasets.mietzinse_kantone]
description = "Durchschnittlicher Mietpreis in CHF nach Zimmerzahl und Kanton (Strukturerhebung)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/33947475/master"
format = "xlsx"
note = "Excel with one sheet per year (2023–2010). 26 cantons + CH total × 7 room categories."
processed_as = "mietzinse_kantone.csv"

# ─── Research & Innovation ─────────────────────────────────────────

[datasets.forschung_ausgaben]
description = "Forschung und Entwicklung: Aufwendungen nach Sektor (Privatwirtschaft, Hochschulen, Bund)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/33948575/master"
format = "xlsx"
note = "Intramuros F+E-Aufwendungen in der Schweiz (all sectors). From opendata.swiss."
processed_as = "forschung_ausgaben.csv"

# ─── Energy & Resilience ───────────────────────────────────────────

[datasets.elektrizitaet_produktion]
description = "Elektrizitätsbilanz der Schweiz — Erzeugung, Import, Export, Verbrauch (Jahreswerte)"
source = "url"
url = "https://www.uvek-gis.admin.ch/BFE/ogd/32/ogd32_elektrizitaetbilanz_jahreswerte.csv"
format = "csv"
note = "BFE OGD electricity balance. Wide CSV: one row per year, columns for hydro run-of-river, storage, nuclear, PV, wind, imports, exports, consumption in GWh."
processed_as = "elektrizitaet_produktion.csv"

[datasets.energieverbrauch_sektor]
description = "Endenergieverbrauch nach Verbrauchergruppe (Industrie, Verkehr, Haushalte, Dienstleistungen)"
source = "url"
url = "https://www.uvek-gis.admin.ch/BFE/ogd/115/ogd115_gest_bilanz.csv"
format = "csv"
note = "BFE OGD Gesamtenergiebilanz. Long CSV: Jahr × Rubrik × Energietraeger → TJ. Filter to Endverbrauch rows."
processed_as = "energieverbrauch_sektor.csv"

# ─── Transitions & Training ───────────────────────────────────────

[datasets.weiterbildung_teilnahme]
description = "Teilnahme an Weiterbildung nach Bildungsniveau, Alter und Geschlecht"
source = "bfs-pxweb"
table = "px-x-1504000000_101"
note = "Continuing education participation rates. Survey data, multiple years."
processed_as = "weiterbildung_teilnahme.csv"
[datasets.weiterbildung_teilnahme.dimensions]
"Weiterbildungsaktivität" = ["0"]
"Bildungsstand" = "*"
"Altersklasse" = "*"
"Geschlecht" = ["0"]
"Jahr" = "*"
"Resultat" = ["0"]

# ─── Life Science & Health ─────────────────────────────────────────

[datasets.gesundheitsausgaben]
description = "Gesundheitsausgaben nach Leistungsart (stationär, ambulant, Medikamente, Verwaltung)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/22324819/master"
format = "xlsx"
note = "Kosten des Gesundheitswesens nach Leistungen. From opendata.swiss."
processed_as = "gesundheitsausgaben.csv"


# ─── Talent & Migration ───────────────────────────────────────────

[datasets.auslaender_aufenthalt]
description = "Ständige ausländische Wohnbevölkerung nach Anwesenheitsbewilligung und Staatsangehörigkeit"
source = "bfs-pxweb"
table = "px-x-0103010000_101"
note = "Foreign resident population by permit type and nationality. 203 nationalities available."
processed_as = "auslaender_aufenthalt.csv"
[datasets.auslaender_aufenthalt.dimensions]
"Jahr" = "*"
"Kanton" = ["8100"]
"Bevölkerungstyp" = ["1"]
"Anwesenheitsbewilligung" = "*"
"Geschlecht" = ["-99999"]
"Altersklasse" = ["-99999"]
"Staatsangehörigkeit" = ["-99999"]

[datasets.wanderungen]
description = "Internationale Wanderungen: Ein- und Auswanderungen nach Staatsangehörigkeit"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/36073728/master"
format = "xlsx"
note = "Immigration/emigration flows by nationality group, 1991-2024. From opendata.swiss."
processed_as = "wanderungen.csv"

# ─── Open State ────────────────────────────────────────────────────

[datasets.ikt_internetnutzung]
description = "Internetnutzung (Online-Aktivitäten) nach Altersgruppe — BFS Omnibus ICT"
source = "bfs-pxweb"
table = "px-x-1604000000_102"
note = "Individual online activities by age group. Email (IUEMCH) as proxy for basic internet usage."
processed_as = "ikt_internetnutzung.csv"
[datasets.ikt_internetnutzung.dimensions]
"Online-Aktivität" = ["IUEMCH"]
"Geschlecht" = ["0"]
"Altersklasse" = "*"
"Bildungsstand" = ["0"]
"Jahr" = "*"
"Absolut / relativ" = ["1"]
"Resultat" = ["0"]

# ─── Neutrality & Defense ─────────────────────────────────────────

[datasets.verteidigungsausgaben]
description = "Militärausgaben als Anteil am BIP — World Bank / SIPRI"
source = "url"
url = "https://api.worldbank.org/v2/country/CHE;DEU;FRA;AUT;SWE;FIN;NOR;USA/indicator/MS.MIL.XPND.GD.ZS?date=2000:2023&format=json&per_page=500"
format = "json"
note = "World Bank API v2 JSON: Military expenditure (% of GDP)."
processed_as = "verteidigungsausgaben.csv"
