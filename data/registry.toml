# Dataset registry — defines what to fetch and from where.
# Run `mise run fetch` to download all datasets.
# Run `mise run fetch <name>` to fetch a specific one.
#
# Source types:
#   bfs-pxweb  — BFS STAT-TAB PxWeb API (POST with dimension query)
#   bfs-dam    — BFS DAM API direct CSV/XLS download
#   url        — arbitrary URL download

# ─── Basic income modelling ──────────────────────────────────────────

[datasets.einkommensverteilung_silc]
description = "Einkommensverteilung nach Dezilen — Gini, Median, Mittelwert, Einkommensanteile (HABE/SILC)"
source = "bfs-dam"
url = "https://www.bfs.admin.ch/bfsstatic/dam/assets/15344786/master"
format = "xlsx"
note = "Excel with one sheet per year (2018–1998). Verfügbares Äquivalenzeinkommen in col F."
processed_as = "einkommensverteilung_silc.csv"

# ─── Digital sovereignty & e-ID ──────────────────────────────────────

[datasets.ikt_egov]
description = "E-Government-Nutzung: Behördenkontakte, Formulare, Informationssuche"
source = "bfs-pxweb"
table = "px-x-1604000000_103"
note = "Has 2014–2025 data. Percentage of population using e-government services."
processed_as = "ikt_egov.csv"
[datasets.ikt_egov.dimensions]
"Online-Dienste in Zusammenhang mit den Behörden" = ["IGV12", "IGOV12IFCH", "IGOV12FMCH", "IGOV12RTCH"]
"Geschlecht" = ["0"]
"Altersklasse" = ["0"]
"Bildungsstand" = ["0"]
"Jahr" = ["2025", "2023", "2021", "2019", "2017", "2014"]
"Absolut / relativ" = ["1"]
"Resultat" = ["0"]

# ─── Automation & labour ─────────────────────────────────────────────

[datasets.erwerbstaetige_sake]
description = "Erwerbstätige (Inlandkonzept) nach Wirtschaftsabschnitt — SAKE Jahres- und Quartalswerte"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/36278176/master"
format = "csv"
note = "Raw CSV with NOGA sector codes (A, B-C, ..., T). Annual data up to 2024, quarterly up to 2025-Q3."
processed_as = "erwerbstaetige_sake.csv"

# ─── Housing & inequality ────────────────────────────────────────────

[datasets.mietzinse_kantone]
description = "Durchschnittlicher Mietpreis in CHF nach Zimmerzahl und Kanton (Strukturerhebung)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/33947475/master"
format = "xlsx"
note = "Excel with one sheet per year (2023–2010). 26 cantons + CH total × 7 room categories."
processed_as = "mietzinse_kantone.csv"

# ─── Research & Innovation ─────────────────────────────────────────

[datasets.forschung_ausgaben]
description = "Forschung und Entwicklung: Aufwendungen nach Sektor (Privatwirtschaft, Hochschulen, Bund)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/32048839/master"
format = "xlsx"
note = "R&D expenditure by performing sector. Multi-sheet XLSX with years 2004–2021."
processed_as = "forschung_ausgaben.csv"

# ─── Energy & Resilience ───────────────────────────────────────────

[datasets.elektrizitaet_produktion]
description = "Elektrizitätsproduktion nach Energieträger (Wasser, Kernkraft, Solar, Wind, etc.)"
source = "bfs-pxweb"
table = "px-x-0800000000_103"
note = "Electricity production by source. Annual data."
processed_as = "elektrizitaet_produktion.csv"
[datasets.elektrizitaet_produktion.dimensions]
"Energieträger" = "*"
"Jahr" = "*"
"Einheit" = ["0"]

[datasets.energieverbrauch_sektor]
description = "Endenergieverbrauch nach Verbrauchergruppe (Industrie, Verkehr, Haushalte, Dienstleistungen)"
source = "bfs-dam"
url = "https://dam-api.bfs.admin.ch/hub/api/dam/assets/32327177/master"
format = "xlsx"
note = "Final energy consumption by sector. XLSX with annual data."
processed_as = "energieverbrauch_sektor.csv"

