# ─── Neutrality & Defense ─────────────────────────────────────────

[datasets.verteidigungsausgaben]
description = "Militärausgaben als Anteil am BIP — World Bank / SIPRI"
source = "url"
url = "https://api.worldbank.org/v2/country/CHE;DEU;FRA;AUT;SWE;FIN;NOR;USA/indicator/MS.MIL.XPND.GD.ZS?date=2000:2023&format=csv&source=2"
